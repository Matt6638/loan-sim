<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>住宅ローン返済シミュレーション ― 移転のお知らせ</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
    padding:24px;background:radial-gradient(900px 520px at 50% 34%, #26385f 0%, #101a30 74%);
    color:#fff;font-family:-apple-system,"Hiragino Sans",sans-serif;text-align:center;}
  .box{max-width:460px}
  h1{font-size:1.18rem;font-weight:600;line-height:1.6;margin:0 0 14px;letter-spacing:.04em}
  p{font-size:.86rem;line-height:1.9;color:#cdd6e6;margin:0 0 20px}
  a.go{display:inline-block;font-size:.92rem;font-weight:700;text-decoration:none;
    color:#1c2b4a;background:linear-gradient(160deg,#fdf9f1,#e9dfc9);
    padding:13px 26px;border-radius:9px;box-shadow:0 10px 28px rgba(0,0,0,.4)}
  .url{margin-top:18px;font-family:ui-monospace,monospace;font-size:.72rem;color:#8fa0bb;word-break:break-all}
  .small{margin-top:22px;font-size:.7rem;color:#7c8aa4;line-height:1.8}
</style>
</head>
<body>
<div class="box">
  <h1>新しいアドレスに移りました</h1>
  <p>お手数ですが、下のボタンから新しいアドレスを開いてください。<br>
     ホーム画面に追加してある場合は、<b>いったん削除して、新しいアドレスから追加し直して</b>ください。</p>
  <a class="go" href="https://housing-loan-sim.pages.dev/">新しいページを開く</a>
  <div class="url">https://housing-loan-sim.pages.dev/</div>
  <p class="small">5秒後に自動で移動します。<br>
     保存しておいたファイル（.json）は、新しいページでもそのまま読み込めます。</p>
</div>
<script>
// 古い置き場所に残っているオフライン用の控えを片付ける（残したままだと古い画面が出続けるため）
(function(){
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      navigator.serviceWorker.getRegistrations().then(function(rs){
        rs.forEach(function(r){ r.unregister(); });
      }).catch(function(){});
    }
    if(window.caches && caches.keys){
      caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){});
    }
  }catch(e){}
  setTimeout(function(){ location.replace('https://housing-loan-sim.pages.dev/'); }, 5000);
})();
</script>
</body>
</html>
